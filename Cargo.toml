[package]
name = "schema-shrink"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["MukundaKatta"]
description = "Analyze and simplify JSON Schemas that exceed Anthropic strict-mode compiled-grammar limits. Spots nullable unions, large enums, deep nesting, and applies documented workarounds."
license = "MIT"
repository = "https://github.com/MukundaKatta/schema-shrink"
homepage = "https://github.com/MukundaKatta/schema-shrink"
documentation = "https://docs.rs/schema-shrink"
readme = "README.md"
keywords = ["llm", "anthropic", "json-schema", "structured-output", "tool-use"]
categories = ["parser-implementations", "api-bindings"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
